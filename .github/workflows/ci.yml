name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out code and runs checks.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: faldo
          POSTGRES_PASSWORD: faldo
          POSTGRES_DB: faldo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faldo -d faldo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: faldo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Prepare database roles
        run: |
          psql -h localhost -U faldo -d faldo_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS citext;"
          psql -h localhost -U faldo -d faldo_test -c "CREATE ROLE faldo_app LOGIN PASSWORD 'faldo_app' NOSUPERUSER NOBYPASSRLS;"
      - run: uv sync --frozen
      - name: Migrate
        run: uv run alembic upgrade head
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://faldo:faldo@localhost:5432/faldo_test
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://faldo_app:faldo_app@localhost:5432/faldo_test
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > requirements-audit.txt
          uvx pip-audit==2.10.1 --strict --disable-pip -r requirements-audit.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
