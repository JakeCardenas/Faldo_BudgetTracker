name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: faldo
          POSTGRES_PASSWORD: faldo
          POSTGRES_DB: faldo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faldo -d faldo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: faldo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Prepare database roles
        run: |
          psql -h localhost -U faldo -d faldo_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS citext;"
          psql -h localhost -U faldo -d faldo_test -c "CREATE ROLE faldo_app LOGIN PASSWORD 'faldo_app' NOSUPERUSER NOBYPASSRLS;"
      - run: uv sync --frozen
      - name: Migrate
        run: uv run alembic upgrade head
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://faldo:faldo@localhost:5432/faldo_test
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://faldo_app:faldo_app@localhost:5432/faldo_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
