name: faldo

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: faldo
      POSTGRES_USER: faldo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faldo}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faldo -d faldo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://faldo_app:faldo_app@db:5432/faldo
      MIGRATION_DATABASE_URL: postgresql+asyncpg://faldo:${POSTGRES_PASSWORD:-faldo}@db:5432/faldo
      RUN_WORKER_IN_API: "false"
      RECEIPT_STORAGE_DIR: /app/var/receipts
      ALLOWED_ORIGINS: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      JOB_MODE: worker
    volumes:
      - receipts:/app/var/receipts
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://faldo_app:faldo_app@db:5432/faldo
      RECEIPT_STORAGE_DIR: /app/var/receipts
    volumes:
      - receipts:/app/var/receipts
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        API_ORIGIN: http://api:8000
        NEXT_PUBLIC_SHOW_DEMO_LOGIN: ${NEXT_PUBLIC_SHOW_DEMO_LOGIN:-true}
    environment:
      API_ORIGIN: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db-data:
  receipts:
